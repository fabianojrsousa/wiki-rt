<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#0d1a3a"/>
      <stop offset="100%" stop-color="#06091a"/>
    </radialGradient>
    <radialGradient id="glow" cx="75%" cy="35%" r="40%">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fundo -->
  <circle cx="20" cy="20" r="20" fill="url(#bg)"/>
  <circle cx="20" cy="20" r="20" fill="url(#glow)"/>

  <!-- Anéis concêntricos -->
  <circle cx="20" cy="20" r="17"  stroke="#60a5fa" stroke-opacity=".38" stroke-width="1"/>
  <circle cx="20" cy="20" r="11.5" stroke="#60a5fa" stroke-opacity=".24" stroke-width=".85"/>
  <circle cx="20" cy="20" r="6"  stroke="#60a5fa" stroke-opacity=".2"  stroke-width=".7"/>

  <!-- Mira (crosshair) -->
  <line x1="20" y1="2.5"  x2="20" y2="37.5" stroke="#60a5fa" stroke-opacity=".13" stroke-width=".6"/>
  <line x1="2.5" y1="20"  x2="37.5" y2="20" stroke="#60a5fa" stroke-opacity=".13" stroke-width=".6"/>

  <!-- Varredura — wedge de ~65° (12h → 1h30) -->
  <!-- De (20,3) a (34.7,11.5): ângulo −90° a −30° -->
  <path d="M20,20 L20,3 A17,17 0 0,1 34.7,11.5 Z"
        fill="#22d3ee" fill-opacity=".14"/>

  <!-- Braço da varredura -->
  <line x1="20" y1="20" x2="34.7" y2="11.5"
        stroke="#22d3ee" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Blip detectado (no anel médio, ao longo do braço) -->
  <!-- r=11.5, ângulo -30°: x=20+11.5*cos(-30°)≈29.96, y=20+11.5*sin(-30°)≈14.25 -->
  <circle cx="30" cy="14.25" r="3.2" fill="#22d3ee" fill-opacity=".25"/>
  <circle cx="30" cy="14.25" r="1.9" fill="#22d3ee"/>

  <!-- Ponto central -->
  <circle cx="20" cy="20" r="2" fill="#93c5fd"/>
  <circle cx="20" cy="20" r=".8" fill="#fff" fill-opacity=".8"/>
</svg>
